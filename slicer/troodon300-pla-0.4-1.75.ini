# Demiourgos print_check config — Vivedino Troodon 300 (300x300x400), PLA, 0.4 mm nozzle, 1.75 mm filament.
#
# A partial PrusaSlicer config: these keys are merged over PrusaSlicer's built-in
# defaults, so only the values that matter for time/filament estimates are set.
# Point print_check at it via DEMIOURGOS_SLICER_CONFIG or the `config` argument.
#
# Filament density is what makes the weight estimate accurate. To use a different
# material, change filament_type, filament_density, and the temperatures:
#   PLA  1.24 g/cm^3   nozzle 210 / bed 60
#   PETG 1.27          nozzle 240 / bed 80
#   ABS  1.04          nozzle 250 / bed 100   (enclosure recommended)
#   ASA  1.07          nozzle 250 / bed 100
#   TPU  1.21          nozzle 225 / bed 50
#   PA/Nylon 1.14      nozzle 260 / bed 70

# --- printer ---
nozzle_diameter = 0.4
bed_shape = 0x0,300x0,300x300,0x300
max_print_height = 400

# --- filament (PLA, 1.75 mm, 1 kg spool) ---
filament_diameter = 1.75
filament_type = PLA
filament_density = 1.24
filament_spool_weight = 1000
filament_cost = 20
temperature = 210
first_layer_temperature = 215
bed_temperature = 60
first_layer_bed_temperature = 60

# --- print quality ---
layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
fill_density = 20%
